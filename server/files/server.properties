# MostWanted's server.properties: only the settings we change. Minecraft adds
# every other setting with its default on the first start.

# The server-list line Java players see (Minehut shows its own listing).
motd=§6§lMostWanted §r§7- Cops vs. prisoners on Java & Bedrock
max-players=100

# Players log in through Minehut's network (start.sh points the session server
# at Minehut). Minehut doesn't support signed chat for external servers.
online-mode=true
enforce-secure-profile=false
server-port=25565
server-name=MostWanted
# Player IPs stay out of the logs (LibertyBans still sees them for IP bans).
log-ips=false

# Closed until launch: only players on the whitelist can join.
white-list=true
enforce-whitelist=true

# One map, built by hand: no generated terrain changes.
level-name=world
generate-structures=false
spawn-protection=0

# Inmates can't break or place blocks: the core plugin decides what can be broken.
gamemode=adventure
force-gamemode=true
difficulty=normal
pvp=true
allow-flight=true
enable-command-block=false

# A busy town, not a sprawling survival world.
view-distance=8
simulation-distance=6
entity-broadcast-range-percentage=100
network-compression-threshold=256
sync-chunk-writes=false
# lz4 saves and loads chunks faster than the default deflate, for slightly bigger files.
region-file-compression=lz4

# MostWanted sends the resource pack itself (resource-pack in its config.yml), not this.
require-resource-pack=false
