[versions]
# The Paper the server runs. Leaf follows Paper's API, so this is what we build against.
# Moved by .github/workflows/minecraft.yml when Paper has a newer stable Minecraft.
paper = "26.3.build.223-stable"
junit = "6.1.3"
resource-factory = "1.4.0"
run-paper = "3.1.0"
# Compile-only: zones are marked with a FAWE selection. Match server/manifest.json.
fawe = "2.16.1"
# The database layer in common, shared by core and backend.
flyway = "13.11.1"
hikari = "7.1.0"
jakarta-xml-bind = "4.0.5"
jooq = "3.21.9"
postgresql = "42.7.14"
slf4j = "2.0.20"
testcontainers = "2.0.5"
# The backend: the website's API and the Discord bot (docs/04-tech.md#the-backend-and-common).
bucket4j = "8.21.0"
jackson = "3.2.4"
javalin = "7.2.4"
jda = "6.7.0"
logback = "1.6.6"
shadow = "9.6.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

fawe-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }

[plugins]
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
resource-factory = { id = "xyz.jpenilla.resource-factory-paper-convention", version.ref = "resource-factory" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
