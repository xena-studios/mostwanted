# Labels for pull requests, by the files they change (actions/labeler, in labels.yml).
core:
  - changed-files:
      - any-glob-to-any-file: core/**
website:
  - changed-files:
      - any-glob-to-any-file: website/**
resource-pack:
  - changed-files:
      - any-glob-to-any-file: pack/**
server:
  - changed-files:
      - any-glob-to-any-file: server/**
common:
  - changed-files:
      - any-glob-to-any-file: common/**
backend:
  - changed-files:
      - any-glob-to-any-file: backend/**
brand:
  - changed-files:
      - any-glob-to-any-file: [brand/**, scripts/brand-assets.py]
build:
  - changed-files:
      - any-glob-to-any-file: [build-logic/**, gradle/**, "*.gradle.kts", scripts/**, tools/**, .github/workflows/**]
documentation:
  - changed-files:
      - any-glob-to-any-file: [docs/**, "**/*.md"]
