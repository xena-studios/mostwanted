# Bot players play the game on a throwaway server (tools/playtest/) and check it
# works: escapes, robberies, arrests, guns, shops, riots and the rest.
name: playtest

on:
  pull_request:
    paths: ["core/**", "common/**", "tools/playtest/**", "gradle/**", "build-logic/**", ".github/workflows/playtest.yml"]
  push:
    branches: [main]
    paths: ["core/**", "common/**", "tools/playtest/**", "gradle/**", "build-logic/**", ".github/workflows/playtest.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/playtest/package-lock.json
      - uses: actions/cache@v6
        with:
          path: |
            .cache/servers
            .cache/playtest-plugins
          key: playtest-${{ hashFiles('gradle/libs.versions.toml', 'tools/playtest/run.mjs') }}
      - run: npm ci
        working-directory: tools/playtest
      - run: npm run playtest
        working-directory: tools/playtest
