name: Build

# The plugins and the backend: not Markdown, the website (website.yml), the game server (server.yml), the resource pack
# (pack.yml) or art and tools. Pull requests always run, so the `build-ok` check main
# requires always reports; `changes` skips the rest when none of that changed.
on:
  push:
    branches: [main]
    paths: ["**", "!**.md", "!website/**", "!.github/workflows/website.yml", "!server/**", "!backend/discord-setup/**", "!.github/workflows/server.yml", "!pack/**", "!.github/workflows/pack.yml", "!brand/**", "!tools/**", "!.github/workflows/playtest.yml", "!.github/ISSUE_TEMPLATE/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Read first, so a failed call fails the step instead of skipping the build.
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          code=false
          while read -r file; do
            case $file in
              *.md | website/* | server/* | backend/discord-setup/* | pack/* | brand/* | tools/* | .github/ISSUE_TEMPLATE/* \
                | .github/workflows/website.yml | .github/workflows/server.yml | .github/workflows/pack.yml | .github/workflows/playtest.yml) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Compiles and runs the tests.
      - run: ./gradlew build
      # Compiles against the newest Paper API, failing on anything it marks for
      # removal, so a coming break shows up here before it reaches the server.
      - run: ./gradlew compileJava -Pxena.newestPaper=26.3.build.223-stable
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          # Plugin jars only: not build-logic, not common, which plugins bundle, and
          # not the backend, which is an app rather than a plugin.
          path: |
            */build/libs/*.jar
            !build-logic/build/libs/*
            !common/build/libs/*
            !backend/build/libs/*
          if-no-files-found: error

  # Boots the plugins on real servers: Leaf, which the live server runs, and
  # Paper, so a failure on Leaf alone points at Leaf rather than at us.
  boot:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        project: [leaf, paper]
        # Keep in step with `paper` in gradle/libs.versions.toml.
        target:
          - { version: "26.3", java: 25 }
    name: boot (${{ matrix.project }} ${{ matrix.target.version }})
    # The database core needs; core/boot/config.yml points at it.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mostwanted
          POSTGRES_PASSWORD: boot-test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - uses: actions/cache@v6
        with:
          path: .cache/servers
          # A new key each run, so a newer server build is saved; the latest is restored.
          key: servers-${{ matrix.project }}-${{ matrix.target.version }}-${{ github.run_id }}
          restore-keys: servers-${{ matrix.project }}-${{ matrix.target.version }}-
      # Runs each module's boot-checks.txt against all the jars at once.
      - env:
          # Leaf's jar comes from GitHub's API, which rate-limits anonymous calls.
          GH_TOKEN: ${{ github.token }}
        run: |
          checks=()
          for file in */boot-checks.txt; do checks+=(--checks "$file"); done
          mapfile -t jars < <(find jars -name '*.jar' | sort)
          scripts/boot-test.sh --project ${{ matrix.project }} --version ${{ matrix.target.version }} \
            "${checks[@]}" "${jars[@]}"

  # The one check main requires: passes when every job above passed or was
  # skipped because nothing they cover changed.
  build-ok:
    needs: [changes, build, boot]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
