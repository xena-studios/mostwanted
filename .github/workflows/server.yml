name: Server

# Installs the game server from server/manifest.json and boots it on Leaf with
# every plugin and config, so a bad version, checksum or config fails here, not
# on the live server. Pull requests always run, so `server-ok` always reports;
# `changes` skips the boot when server/ didn't change.
on:
  push:
    branches: [main]
    paths: ["server/**", "brand/out/server-icon.png", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.check.outputs.server }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "server=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          server=false
          while read -r file; do
            case $file in server/* | brand/out/server-icon.png | .github/workflows/server.yml) server=true ;; esac
          done < <(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "server=$server" >> "$GITHUB_OUTPUT"

  boot:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: build/server/.cache
          key: server-${{ hashFiles('server/manifest.json') }}
      # A test copy: LuckPerms on its local H2 file instead of PostgreSQL.
      - run: |
          mkdir -p build/server
          sed -e 's/^LUCKPERMS_STORAGE=.*/LUCKPERMS_STORAGE=h2/' -e 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/' server/.env.example > build/server/.env
          server/install.sh build/server
          server/test.sh build/server
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: build/server/test-console.log

  # The check main can require: passes when the boot passed or was skipped
  # because server/ didn't change.
  server-ok:
    needs: [changes, boot]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
