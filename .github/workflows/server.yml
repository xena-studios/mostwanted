name: Server

# Installs the game server from server/manifest.json and boots it on Leaf with
# every plugin and config, so a bad version, checksum or config fails here, not
# on the live server. Pull requests always run, so `server-ok` always reports;
# `changes` skips the boot when server/ didn't change.
on:
  push:
    branches: [main]
    paths: ["server/**", "brand/out/server-icon.png", ".github/workflows/server.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.check.outputs.server }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then echo "server=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Read first, so a failed call fails the step instead of skipping the build.
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          server=false
          while read -r file; do
            case $file in server/* | brand/out/server-icon.png | .github/workflows/server.yml) server=true ;; esac
          done <<< "$files"
          echo "server=$server" >> "$GITHUB_OUTPUT"

  boot:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: build/server/.cache
          key: server-${{ hashFiles('server/manifest.json') }}
      # A test copy: LuckPerms and LibertyBans on local files instead of PostgreSQL.
      - run: |
          mkdir -p build/server
          sed -e 's/^LUCKPERMS_STORAGE=.*/LUCKPERMS_STORAGE=h2/' -e 's/^LIBERTYBANS_DATABASE=.*/LIBERTYBANS_DATABASE=HSQLDB/' -e 's/^DB_PASSWORD=.*/DB_PASSWORD=ci/' server/.env.example > build/server/.env
          server/install.sh build/server
          server/test.sh build/server
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: build/server/test-console.log

  # Every shell script in the repo. A few seconds, so always.
  shellcheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | head -2
          git ls-files -z '*.sh' | xargs -0 shellcheck

  # The eggs and the panel's files: every egg has what Calagopus needs to import
  # it, its install script passes shellcheck, and the Compose files are valid.
  # Seconds, so always.
  panel:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          for egg in server/eggs/*.json; do
            jq -e '(.name | length > 0) and (.author | length > 1) and (.startup | length > 0)
              and (.docker_images | length > 0) and (.config.stop | length > 0)
              and (.scripts.installation.script | length > 0)
              and all(.variables[]; (.env_variable | test("^[A-Z0-9_]+$")) and (.rules | length > 0))' "$egg" >/dev/null \
              || { echo "::error file=$egg::missing a field Calagopus needs"; exit 1; }
            jq -r .scripts.installation.script "$egg" | shellcheck -s bash -
          done
          APP_ENCRYPTION_KEY=ci docker compose -f server/panel/compose.yml config -q
          docker compose -f server/panel/db-agent/compose.yml config -q

  # The check main can require: passes when the boot, shellcheck and panel passed,
  # or the boot was skipped because server/ didn't change.
  server-ok:
    needs: [changes, boot, shellcheck, panel]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "ok"
