# Every message MostWanted sends, in the message style (docs/09-brand.md#messages).
# Edit and restart to apply. Text is MiniMessage: https://docs.advntr.dev/minimessage/format
#
# Write plain text: it becomes small caps when it loads. Text inside <value>, <money>,
# <white>, <keep> or bold stays as written, for names, amounts and headers.
# Colour tags: <success> <error> <money> <info> <brand> <inmate> <criminal> <guard>
# <staff> <value> <dim>. Everything else is grey.
# Placeholders such as <player> are filled in when the message is sent, as written.

login:
  failed: "<error>✖</error> your data didn't load. try again in a moment."
  already-online: "<error>✖</error> you're still connected. try again in a moment."

join:
  welcome: "<success>✔</success> welcome back, <value><player></value>."
  first: "<success>✔</success> welcome to <brand>mostwanted</brand>, <value><player></value>. you're an <inmate>inmate</inmate>: find a way out."

command:
  info: "<info>ⓘ</info> <value><version></value> · <value>database <database></value>"
  bad-role: "<error>✖</error> roles: <value>inmate, criminal, guard</value>."
  player-not-found: "<error>✖</error> <value><player></value> isn't online."
  player: "<info>ⓘ</info> <value><player></value>: <role>, cash <money><cash></money>, bank <money><bank></money>, bounty <money><bounty></money>."
  role-set: "<success>✔</success> <value><player></value> is now <role>."
  cash-set: "<success>✔</success> <value><player></value>'s cash is now <money><amount></money>."
  bank-set: "<success>✔</success> <value><player></value>'s bank is now <money><amount></money>."
  bounty-set: "<success>✔</success> <value><player></value>'s bounty is now <money><amount></money>."
  given: "<success>✔</success> gave <value><player></value> <value><amount></value>× <value><item></value>."
  give-unknown: "<error>✖</error> there's no <kind> called <value><id></value>."
  zone:
    players-only: "<error>✖</error> only players can do that."
    needs-fawe: "<error>✖</error> zones are marked with a fawe selection, and fawe isn't installed."
    no-selection: "<error>✖</error> select the area first: <value>//wand</value>, then click two corners."
    bad-name: "<error>✖</error> zone names are lowercase letters, numbers, - and _, up to 32 characters."
    bad-kind: "<error>✖</error> zone kinds: <value><kinds></value>."
    exists: "<error>✖</error> there's already a zone called <value><zone></value>. <value>/mw zone redefine <zone></value> moves it."
    not-found: "<error>✖</error> there's no zone called <value><zone></value>."
    other-world: "<error>✖</error> <value><zone></value> is in <value><world></value>. stand there to set its spawn."
    no-world: "<error>✖</error> the world <value><world></value> isn't loaded."
    created: "<success>✔</success> created the <value><kind></value> zone <value><zone></value>, <value><size></value> blocks."
    redefined: "<success>✔</success> moved <value><zone></value> to your selection, <value><size></value> blocks."
    spawn-set: "<success>✔</success> <value><zone></value>'s spawn is where you're standing."
    deleted: "<success>✔</success> deleted <value><zone></value>."
    list: "<info>ⓘ</info> zones: <value><count></value>"
    list-entry: "<dim>·</dim> <value><zone></value> <kind>, <value><size></value> in <value><world></value>"
    list-empty: "<info>ⓘ</info> no zones yet. select an area with fawe, then <value>/mw zone create [name] [kind]</value>."
    here: "<info>ⓘ</info> you're in: <value><zones></value>"
    here-none: "<info>ⓘ</info> you're not in any zone."

# Shown above the hotbar on walking into a zone.
zone:
  entered:
    prison: "<inmate>⛓</inmate> the prison"
    cell: "<inmate>⛓</inmate> a cell"
    police: "<guard>⚑</guard> police station · <guard>safe for guards</guard>"
    hideout: "<criminal>⌂</criminal> hideout · <criminal>safe for criminals</criminal>"
    robbery: "<money>⛃</money> <value><zone></value>"
    safe: "<success>✔</success> safe zone"
    alarm: "<inmate>⚑</inmate> riot alarm · <value>right-click</value> it with other inmates"

escape:
  wall-alert: "<criminal>⚑</criminal> the prison wall at <value><wall></value> has been broken!"
  keycard-alert: "<criminal>⚑</criminal> <inmate><player></inmate> used a keycard on <value><gate></value>!"
  gate-locked: "<error>✖</error> locked. a guard's keycard opens it."
  you: "<success>✔</success> you escaped! you're a <criminal>criminal</criminal> now: rob, stay free, and bank your cash at a hideout."
  everyone: "<criminal>⚑</criminal> <criminal><player></criminal> escaped from the prison!"

# The scoreboard (docs/09-brand.md#scoreboard-and-tab-list). Icons are grey.
hud:
  title: "<b><white>Most</white><brand>Wanted</brand></b>"
  clock: "◷ <time> <zone> · <date>"
  profile: "<b><brand>PROFILE</brand></b>"
  role: "★ role: <role>"
  cash: "⛃ cash: <money><amount></money>"
  bank: "⌂ bank: <money><amount></money>"
  bounty: "✪ bounty: <money><amount></money>"
  wanted: "⚠ wanted: <criminal><stars></criminal><dim><empty></dim>"
  sentence: "⧗ sentence: <value><time></value>"
  escapes: "⚔ escapes: <value><count></value>"
  arrested: "☠ arrested: <value><count></value>"
  duty: "✔ duty: <success>on</success>"
  patrol: "<b><brand>PATROL</brand></b>"
  arrests: "⛓ arrests: <value><count></value>"
  bounty-earned: "✪ bounty earned: <money><amount></money>"
  # Live events, red while they're on.
  heist: "<b><error>HEIST</error></b>"
  heist-place: "⚑ place: <value><place></value>"
  heist-time: "⧗ time left: <value><time></value>"
  heist-guards: "⚔ guards: <guard><count></guard>"
  riot: "<b><error>RIOT</error></b>"
  riot-rioters: "⚑ rioters: <inmate><count></inmate>"
  footer: "<brand>mostwantedmc.com</brand>"

# The tab list. <head> is the player's own head (Java only).
tab:
  header: "<b><white>Most</white><brand>Wanted</brand></b>\n<head> <white><player></white>\n<color:white>you are playing on </color><brand>mostwanted</brand>\n<color:white>we have </color><brand><online></brand><color:white> players online</color>\n"
  footer: "\n<guard>guards</guard> <value><guards></value><dim> · </dim><criminal>criminals</criminal> <value><criminals></value><dim> · </dim><inmate>inmates</inmate> <value><inmates></value>\n<brand>mostwantedmc.com</brand>"
  entry:
    inmate: "<inmate>inmate</inmate> <value><player></value>"
    criminal: "<criminal>criminal</criminal> <criminal><player></criminal>"
    guard: "<guard>guard</guard> <guard><player></guard>"

arrest:
  you: "<guard>⚑</guard> <guard><officer></guard> arrested you. you lost <money><cash></money> in cash and your gear, and you're in a cell for <value><time></value>."
  you-died: "<guard>⚑</guard> you died, so you're back in prison. you lost <money><cash></money> in cash and your gear, and you're in a cell for <value><time></value>."
  guard: "<success>✔</success> you arrested <criminal><player></criminal> and earned <money><amount></money>."
  guard-killed: "<success>✔</success> you took down <criminal><player></criminal> and earned <money><amount></money>. cuff criminals instead for the whole bounty."
  everyone: "<guard>⚑</guard> <criminal><player></criminal> was arrested by <guard><officer></guard>."
  everyone-died: "<guard>⚑</guard> <criminal><player></criminal> is back in prison."
  stay: "<error>✖</error> you're serving a sentence. back in your cell."
  released: "<success>✔</success> your sentence is over. you're free to roam the prison."

cuffs:
  too-far: "<error>✖</error> get closer to <value><player></value>."
  not-a-guard: "<error>✖</error> only guards on duty can use handcuffs."
  not-a-criminal: "<error>✖</error> <value><player></value> isn't a criminal."
  protected: "<error>✖</error> <value><player></value> is in a safe zone."

duty:
  went-on: "<success>✔</success> you're on duty. right-click a criminal with your <guard>handcuffs</guard> to arrest them."
  went-off: "<success>✔</success> you're off duty."
  in-combat: "<error>✖</error> you're in a fight. try again in a few seconds."
  jailed: "<error>✖</error> finish your sentence first."
  criminal: "<error>✖</error> criminals can't go on duty. get arrested first."
  removed: "<info>ⓘ</info> you're not a guard any more, so you're off duty."

bounty:
  guard-killed: "<money>★</money> you killed <guard><player></guard>: <money>+<amount></money> bounty."

item:
  handcuffs:
    name: "<guard><keep>Handcuffs</keep></guard>"
    lore: "right-click a criminal to arrest them"
  gun:
    name: "<white><name></white>"
    guard-name: "<guard><name></guard>"
    lore: "<value><damage></value> damage · <value><magazine></value> rounds · right-click to shoot"
    taser-lore: "right-click to slow a criminal so you can cuff them"
  ammo:
    name: "<white><name></white>"
  keycard:
    name: "<guard><keep>Keycard</keep></guard>"
    lore: "right-click a gate to open it"

robbery:
  open: "<criminal><b>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</b></criminal>\n<criminal>⚑</criminal> <b><criminal>ROBBERY</criminal></b> <value><place></value> is open.\ncriminals, it's yours if you can hold it.\n<criminal><b>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</b></criminal>"
  started: "<criminal>⚑</criminal> you're robbing <value><place></value>. stay inside for <value><time></value>: if everyone leaves, it fails."
  alarm: "<criminal>⚑</criminal> alarm! <value><place></value> is being robbed."
  bar: "<criminal>⚑</criminal> robbing <value><place></value> · <value><time></value>"
  got-away: "<success>✔</success> you got <money><amount></money> from <value><place></value>, and <money>+<bounty></money> bounty. bank it at a hideout before you're caught!"
  robbed: "<criminal>⚑</criminal> <value><place></value> was robbed!"
  failed: "<guard>⚑</guard> the robbery at <value><place></value> failed."

bank:
  deposited: "<success>✔</success> banked <money><amount></money>. you have <money><total></money> safe in the bank."

stats:
  is-public: "<info>ⓘ</info> your stats show on the website, in discord and on leaderboards. <value>/stats private</value> hides them."
