  failed: "<error>✖</error> couldn't make a code. try again."

gun:
  hud: "<white><name></white> <value><loaded></value><dim>/<magazine></dim> · <value><spare></value> spare"
  reloading: "<white><name></white> reloading…"
  no-ammo: "<error>✖</error> no <value><ammo></value> left. <value>/shop</value> at a hideout or the police station sells more."
