  now-private: "<success>✔</success> your stats are hidden from the website, discord and leaderboards. players in game still see you play."
  now-public: "<success>✔</success> your stats show on the website, in discord and on leaderboards again."

website:
  code: "<info>ⓘ</info> your code is <b><value><code></value></b>. enter it at <value>mostwantedmc.com/login</value> within <value><minutes></value> minutes. never share it: it signs in as you."
